<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=0.25, user-scalable=yes" />

  <meta name="theme-color" content="#075ca8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/pwa-192.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <script>
    // 첫 화면이 그려지기 전에 저장된 테마를 적용해서 라이트/다크가 번쩍이지 않게 한다 (기본값: 다크)
    try {
      var __t = localStorage.getItem('pm_theme_mode') || 'dark';
      document.documentElement.setAttribute('data-theme', __t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>
    // 이 앱은 서비스워커를 쓰지 않는다. 예전 버전이 남긴 서비스워커와 캐시를 지운다. (화면 미갱신 방지)
    // 주의: main.jsx 에서 서비스워커를 다시 등록하면 이 정리와 부딪혀 iPad 에서 무한 새로고침이 난다.
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) { r.unregister(); }
        }).catch(function() {});
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var k of keys) { caches.delete(k); }
        }).catch(function() {});
      }
    } catch (e) {}
  </script>

  <title>Project 관리</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>..
